# Omnicopter configuration - 8-motor fully actuated vehicle
# Based on cube-corner motor placement from reference paper
#
# LOW FIDELITY MODEL for INDI control design:
# - Linear thrust: T = T_max * u, where u in [-1, 1]
# - No aerodynamic forces/moments
# - No reaction torques from rotor spin (torques only from thrust moment arms)
# - No motor dynamics (direct command pass-through)
#
# Motor positions from P matrix (scaled by 0.184m):
#   P = (1/sqrt(3)) * [pattern matrix] * 0.184m
#   Each motor at corner of cube, 0.184m from CG
#
# Thrust directions from N matrix:
#   a = 1/2 + 1/sqrt(12) = 0.7887
#   b = 1/2 - 1/sqrt(12) = 0.2113
#   c = 1/sqrt(3) = 0.5774
#
# sigma (rotation direction): [-1, -1, 1, 1, 1, 1, -1, -1]
#   Not used for torque (poly_torque = 0) but kept for completeness

!ComplexAircraftParams
aero: !AeroParams
  cd: 0.0  # No aerodynamic drag in low-fidelity model

mass: !MassParams
  mass_kg: 0.892  # Total vehicle mass
  cg_m: [0.0, 0.0, 0.0]  # Center of mass at origin
  inertia_kgm2:  # Estimated for 0.892 kg, centered mass, ~0.45m edge cube
    # Small inertia since mass is centered (electronics/battery at center)
    # Rough estimate: I ~ 0.1 * m * r^2 where r ~ 0.184m
    # I ~ 0.1 * 0.886 * 0.184^2 ~ 0.003 kg*m^2
    - [0.0116, 0.0, 0.0]     # Ixx
    - [0.0, 0.0113, 0.0]     # Iyy
    - [0.0, 0.0, 0.0113]     # Izz

geo: !GeoParams
  front_area_m2: [0.01, 0.01, 0.01, 0.01]  # Not used (cd=0)

prop: !PropParams
  # LINEAR thrust model: T = T_max * u = 9.375 * u (50% more than before)
  # For numpy.polynomial.Polynomial with coeffs [c0, c1]: T = c0 + c1*u
  # YAML is in DESCENDING order [c1, c0], so poly_thrust: [9.375, 0.0]
  # This gives T = 9.375*u + 0.0
  poly_thrust: [9.375, 0.0]  # Linear: T = 9.375 * u (N), u in [-1, 1]
  
  # No reaction torque in low-fidelity model
  poly_torque: [0.0, 0.0]  # Q = 0 (torques only from thrust moment arms)

motor: !ComplexMotorParams
  # 8 motors at cube corners using the PX4 omnicopter convention.
  # Signs follow the PX4 layout, with each coordinate magnitude scaled to 0.14 m.
  pos_m:
    - [0.1400, -0.1400, -0.1400]   # M1
    - [-0.1400, -0.1400, -0.1400]  # M2
    - [0.1400, 0.1400, -0.1400]    # M3
    - [-0.1400, 0.1400, -0.1400]   # M4
    - [0.1400, -0.1400, 0.1400]    # M5
    - [-0.1400, -0.1400, 0.1400]   # M6
    - [0.1400, 0.1400, 0.1400]     # M7
    - [-0.1400, 0.1400, 0.1400]    # M8

  # Rotation direction (sigma) using the existing convention:
  #   +1 = counterclockwise about the thrust axis
  #   -1 = clockwise about the thrust axis
  dir: [-1, -1, 1, -1, 1, -1, -1, 1]

  # PX4 omnicopter rotor axis directions.
  # These are normalized in code on load.
  thrust_dir:
    - [0.79, 0.21, 0.58]    # M1
    - [-0.21, 0.79, -0.58]  # M2
    - [-0.21, 0.79, 0.58]   # M3
    - [0.79, 0.21, -0.58]   # M4
    - [0.79, 0.21, -0.58]   # M5
    - [-0.21, 0.79, 0.58]   # M6
    - [-0.21, 0.79, -0.58]  # M7
    - [0.79, 0.21, 0.58]    # M8
