# Omnicopter configuration - 8-motor fully actuated vehicle
# HIGH FIDELITY MODEL for testing INDI robustness
#
# High-fidelity model features:
# - Quadratic thrust: T = T_max * u^2, where u in [-1, 1]
# - Aerodynamic drag (cd = 0.3)
# - Reaction torques from rotor spin
# - Motor dynamics (handled by effector in test script)
#
# From the paper, the matrices are:
#   P = (1/sqrt(3)) * [±1, ±1, ±1] pattern, scaled by arm_length
#   N = thrust direction matrix with a, b, c components
#   sigma = [-1, -1, 1, 1, 1, 1, -1, -1]
#
# where:
#   a = 1/2 + 1/sqrt(12) = 0.78867513
#   b = 1/2 - 1/sqrt(12) = 0.21132487
#   c = 1/sqrt(3) = 0.57735027
#
# KEY PROPERTY: sum(N) = [0,0,0] and sum(PN) = [0,0,0]
# This ensures equal throttle produces zero torque.

!ComplexAircraftParams
aero: !AeroParams
  cd: 0.3  # Aerodynamic drag coefficient #TODO: not sure if this value is good or not

mass: !MassParams
  mass_kg: 0.892  # Total vehicle mass
  cg_m: [0.0, 0.0, 0.0]  # Center of mass at origin
  inertia_kgm2:  # Estimated for 0.886 kg, centered mass
    - [0.0116, 0.0, 0.0]     # Ixx
    - [0.0, 0.0113, 0.0]     # Iyy
    - [0.0, 0.0, 0.0113]     # Izz

geo: !GeoParams
  front_area_m2: [0.01, 0.01, 0.01, 0.01]  # Frontal areas for drag

prop: !PropParams
  # QUADRATIC thrust model: T = T_max * u^2 = 6.25 * u^2
  poly_thrust: [6.25, 0.0, 0.0]  # Quadratic: T = 6.25 * u^2 (N)
  
  # Reaction torque: Q = Q_max * u^2 = 0.07 * u^2
  # With all same-direction sigma, reaction torques cancel (since sum(N)=0)
  poly_torque: [0.09, 0.0, 0.0]  # Quadratic: Q = 0.09 * u^2 (N-m)

motor: !ComplexMotorParams
  # 8 motors at cube corners
  # P matrix columns (scaled by 0.184/sqrt(3) = 0.106232 m):
  #   Motor i: P[:,i] = 0.106232 * [±1, ±1, ±1]
  # Pattern: [+,+,+], [-,+,+], [+,-,+], [-,-,+], [+,+,-], [-,+,-], [+,-,-], [-,-,-]
  pos_m:
    - [0.1400, 0.1400, 0.1400]
    - [-0.1400, 0.1400, 0.1400]
    - [0.1400, -0.1400, 0.1400]
    - [-0.1400, -0.1400, 0.1400]
    - [0.1400, 0.1400, -0.1400]
    - [-0.1400, 0.1400, -0.1400]
    - [0.1400, -0.1400, -0.1400]
    - [-0.1400, -0.1400, -0.1400]


      
  
  # Rotation direction (sigma): ALL SAME for balanced reaction torques
  # Since sum(N) = [0,0,0], constant sigma gives sum(sigma*N) = 0
  # This ensures reaction torques cancel at hover
  dir: [1, 1, 1, 1, -1, -1, -1, -1] # TODO: determine the correct configuration of these values
  
  # N matrix columns (thrust directions, unit vectors)
  # a = 0.78867513, b = 0.21132487, c = 0.57735027
  # N = [[-a, b, -b, a, a, -b, b, -a],
  #      [b, a, -a, -b, -b, -a, a, b],
  #      [c, -c, -c, c, c, -c, -c, c]]
  thrust_dir:
    - [-0.78867513, 0.21132487, 0.57735027]   # Motor 0: N col 1 = [-a, b, c]
    - [0.21132487, 0.78867513, -0.57735027]   # Motor 1: N col 2 = [b, a, -c]
    - [-0.21132487, -0.78867513, -0.57735027] # Motor 2: N col 3 = [-b, -a, -c]
    - [0.78867513, -0.21132487, 0.57735027]   # Motor 3: N col 4 = [a, -b, c]
    - [0.78867513, -0.21132487, 0.57735027]   # Motor 4: N col 5 = [a, -b, c]
    - [-0.21132487, -0.78867513, -0.57735027] # Motor 5: N col 6 = [-b, -a, -c]
    - [0.21132487, 0.78867513, -0.57735027]   # Motor 6: N col 7 = [b, a, -c]
    - [-0.78867513, 0.21132487, 0.57735027]   # Motor 7: N col 8 = [-a, b, c]
