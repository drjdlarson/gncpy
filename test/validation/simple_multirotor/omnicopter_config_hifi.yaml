# Omnicopter configuration - 8-motor fully actuated vehicle
# HIGH FIDELITY MODEL for testing INDI robustness
#
# High-fidelity model features:
# - Quadratic thrust: T = T_max * u^2, where u in [-1, 1]
# - Aerodynamic drag (cd = 0.3)
# - Reaction torques from rotor spin
# - Motor dynamics (handled by effector in test script)
#
# From the paper, the matrices are:
#   P = (1/sqrt(3)) * [±1, ±1, ±1] pattern, scaled by arm_length
#   N = thrust direction matrix with a, b, c components
#   sigma = [-1, -1, 1, 1, 1, 1, -1, -1]
#
# where:
#   a = 1/2 + 1/sqrt(12) = 0.78867513
#   b = 1/2 - 1/sqrt(12) = 0.21132487
#   c = 1/sqrt(3) = 0.57735027
#
# KEY PROPERTY: sum(N) = [0,0,0] and sum(PN) = [0,0,0]
# This ensures equal throttle produces zero torque.

!ComplexAircraftParams
aero: !AeroParams
  cd: 0.3  # Aerodynamic drag coefficient #TODO: not sure if this value is good or not

mass: !MassParams
  mass_kg: 0.870  # Total vehicle mass (lighter than LoFi: 0.892 -> 0.870, -2.5%)
  cg_m: [0.002, 0.001, -0.001]  # CG offset from origin (very small)
  inertia_kgm2:  # Slightly different from LoFi (±1.5% variation)
    - [0.0118, 0.0, 0.0]     # Ixx (+1.7% from LoFi)
    - [0.0, 0.0111, 0.0]     # Iyy (-1.8% from LoFi)
    - [0.0, 0.0, 0.0115]     # Izz (+1.8% from LoFi)

geo: !GeoParams
  front_area_m2: [0.01, 0.01, 0.01, 0.01]  # Frontal areas for drag

prop: !PropParams
  # QUADRATIC thrust model: T = T_max * u^2 = 9.375 * u^2 (50% more than before)
  poly_thrust: [9.375, 0.0, 0.0]  # Quadratic: T = 9.375 * u^2 (N)
  
  # Reaction torque: Q = Q_max * u^2 = 0.135 * u^2 (scaled with thrust)
  # With all same-direction sigma, reaction torques cancel (since sum(N)=0)
  poly_torque: [0.135, 0.0, 0.0]  # Quadratic: Q = 0.135 * u^2 (N-m)

motor: !ComplexMotorParams
  # 8 motors at cube corners using the PX4 omnicopter convention.
  # Signs follow the PX4 layout, with each coordinate magnitude scaled to 0.14 m.
  pos_m:
    - [0.1400, -0.1400, -0.1400]   # M1
    - [-0.1400, -0.1400, -0.1400]  # M2
    - [0.1400, 0.1400, -0.1400]    # M3
    - [-0.1400, 0.1400, -0.1400]   # M4
    - [0.1400, -0.1400, 0.1400]    # M5
    - [-0.1400, -0.1400, 0.1400]   # M6
    - [0.1400, 0.1400, 0.1400]     # M7
    - [-0.1400, 0.1400, 0.1400]    # M8

  # Rotation direction (sigma) using the existing convention:
  #   +1 = counterclockwise about the thrust axis
  #   -1 = clockwise about the thrust axis
  dir: [1, 1, 1, 1, -1, -1, -1, -1]

  # PX4 omnicopter rotor axis directions.
  # These are normalized in code on load.
  thrust_dir:
    - [0.79, 0.21, 0.58]    # M1
    - [-0.21, 0.79, -0.58]  # M2
    - [-0.21, 0.79, 0.58]   # M3
    - [0.79, 0.21, -0.58]   # M4
    - [0.79, 0.21, -0.58]   # M5
    - [-0.21, 0.79, 0.58]   # M6
    - [-0.21, 0.79, -0.58]  # M7
    - [0.79, 0.21, 0.58]    # M8
